name: Tests
# VORLAGE (scripts/test-workflow.yml) – nur über die GitHub-Weboberfläche unter fcou1005 als .github/workflows/test.yml anlegen (Audit OPS-13).
# Läuft bei jedem Push auf main (außer reinen Daten-/Doku-Änderungen) und von Hand: alle Testdateien wie in CLAUDE.md, danach die
# Browser-Tests mit festem Datenstand (test/browser.mjs, S3.1: Fixture im Repo, kein Netz, inhaltliche Prüfungen je Ansicht), Barrierefreiheit,
# Screenshots und Lighthouse (S3.6, gleiches Fixture) und ein
# Browser-Rauchtest aller Ansichten gegen den echten Datenstand aus dem Branch data – rot, wenn eine Ansicht einen Skriptfehler wirft.
# Liest nur (contents: read); stößt nichts an und schreibt nichts.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Testdateien (ohne Netz; Fixture-Test auf Port 8765)
        run: npm run test:all

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Typprüfung (lib/ fehlerfrei, sonst nicht mehr Fehler als in typecheck-baseline.json)
        run: |
          npm ci --no-audit --no-fund
          node scripts/typecheck.mjs
      - name: Build mit Größenbudget (Start ≤ 180 KB, Disposition ≤ 270 KB gzip)
        run: node scripts/build-web.mjs --budget
      - name: README und Handbuch (markdownlint; Verweise und Datenformate prüft test/handbuch.test.mjs im Job unit)
        run: npx --yes markdownlint-cli2@0.18.1
      - name: Datenverträge (schemas/*.schema.json) für Fixture und letzten Datenstand aus dem Branch data
        run: |
          node test/schema.mjs
          git fetch --depth 1 --no-tags origin data
          mkdir -p /tmp/data
          git archive FETCH_HEAD status.json latest.json sources.json calib.json history events cells ops boundaries forecast | tar -x -C /tmp/data
          node test/schema.mjs /tmp/data

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Abhängigkeiten (nur Build und Tests) und Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-Tests mit festem Datenstand (dreimal, Läufe müssen gleich sein)
        env:
          BROWSER_RUNS: '3'
        run: node test/browser.mjs
      - name: Barrierefreiheit (axe, 0 Verstöße auf Live, Disposition, Bericht, Prognose, Quellen) und Referenz-Screenshots
        run: node test/a11y.mjs
      - name: Screenshots als Artefakt (Vergleich nur, wenn Chromium und Schriften zur Referenz passen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/mp-shots/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Lighthouse (Skript ≤ 300 KB auf Live und Disposition, Barrierefreiheit ≥ 0,95; Fixture, kein Netz)
        run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Lighthouse-Berichte als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/berichte/
          retention-days: 14
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Playwright und Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rauchtest aller Ansichten (echter Datenstand)
        run: node scripts/smoke.mjs
