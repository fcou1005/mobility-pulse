name: Tests
# VORLAGE (scripts/test-workflow.yml) – nur über die GitHub-Weboberfläche unter fcou1005 als .github/workflows/test.yml anlegen (Audit OPS-13).
# Läuft bei jedem Push auf main (außer reinen Daten-/Doku-Änderungen) und von Hand: alle Testdateien wie in CLAUDE.md, danach die
# Browser-Tests mit festem Datenstand (test/browser.mjs, S3.1: Fixture im Repo, kein Netz, inhaltliche Prüfungen je Ansicht) und ein
# Browser-Rauchtest aller Ansichten gegen den echten Datenstand aus dem Branch data – rot, wenn eine Ansicht einen Skriptfehler wirft.
# Liest nur (contents: read); stößt nichts an und schreibt nichts.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Testdateien (ohne Netz; Fixture-Test auf Port 8765)
        run: npm run test:all

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Typprüfung (lib/ fehlerfrei, sonst nicht mehr Fehler als in typecheck-baseline.json)
        run: |
          npm ci --no-audit --no-fund
          node scripts/typecheck.mjs
      - name: Build mit Größenbudget (Start ≤ 180 KB, Disposition ≤ 270 KB gzip)
        run: node scripts/build-web.mjs --budget

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Abhängigkeiten (nur Build und Tests) und Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-Tests mit festem Datenstand (dreimal, Läufe müssen gleich sein)
        env:
          BROWSER_RUNS: '3'
        run: node test/browser.mjs

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Playwright und Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rauchtest aller Ansichten (echter Datenstand)
        run: node scripts/smoke.mjs
