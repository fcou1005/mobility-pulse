name: Wächter

# Hält die Sammler-Kette am Leben – als eigene Kette neben dem Sammler: prüft alle ~16 Min., ob ein Sammler-Lauf läuft oder wartet, stößt
# sonst einen an und stößt danach die eigene nächste Prüfung an. Anlass: 9.11.2026 18:21 UTC startete ein angestoßener Sammler-Lauf bei GitHub
# nicht (Fehlstart ohne Job), die Kette stand bis zum Neustart von Hand. Der Auslöser workflow_run springt hier nicht an (Sammler-Läufe stößt
# der GITHUB_TOKEN an, dessen Ereignisse starten keine anderen Workflows – getestet 9.11.2026: kein Lauf nach drei Sammler-Läufen); der
# Zeitplan springt bei GitHub nur alle paar Stunden an und dient nur noch als Rückfall, falls diese Kette selbst abreißt.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: waechter
  cancel-in-progress: false

permissions:
  actions: write
  issues: write   # Hinweis-Issue, wenn der Sammler länger als 60 Min. keinen erfolgreichen Lauf hatte

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Sammler-Kette prüfen, bei Bedarf anstoßen, nächste Prüfung anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sammler() { gh run list -R "$REPO" -w collect.yml -L 10 --json status -q '[.[] | select(.status != "completed")] | length' || echo 1; }
          # Angestoßen heißt nicht gestartet (11.11.2026: „Startup failure“ bei GitHub, beide Ketten abgerissen): nach 60 s prüfen, sonst erneut
          gestartet() { gh run list -R "$REPO" -w "$1" -L 5 --json databaseId,conclusion,createdAt -q "[.[] | select(.createdAt >= \"$2\")] | sort_by(.databaseId) | last | if . == null then \"keiner\" elif .conclusion == \"startup_failure\" then \"fehlstart\" else \"ok\" end" || echo ok; }
          anstossen() { for i in 1 2 3 4 5 6 7 8; do t0=$(date -u +%FT%TZ); if gh workflow run "$1" -R "$REPO" --ref main; then sleep 60; z=$(gestartet "$1" "$t0"); echo "$1: $z"; [ "$z" = ok ] && return 0; echo "::warning::$1 startet nicht ($z), neuer Versuch"; else echo "Anstoßen von $1 fehlgeschlagen (Versuch $i)"; fi; sleep 30; done; return 1; }
          # Sammler länger als 60 Min. ohne erfolgreichen Lauf → ein offenes Issue (Label „ausfall“), damit der Repo-Inhaber benachrichtigt wird
          letzter=$(gh run list -R "$REPO" -w collect.yml -L 20 --json conclusion,updatedAt -q '[.[] | select(.conclusion == "success")] | .[0].updatedAt' || true)
          if [ -n "$letzter" ] && [ $(( $(date +%s) - $(date -d "$letzter" +%s) )) -gt 3600 ]; then
            offen=$(gh issue list -R "$REPO" -l ausfall -s open --json number -q '.[0].number' 2>/dev/null || true)
            if [ -z "$offen" ]; then gh label create ausfall -R "$REPO" -c B60205 -d "Sammler-Teilausfall (automatisch)" 2>/dev/null || true
              gh issue create -R "$REPO" -l ausfall -t "Sammler: kein erfolgreicher Lauf seit $(TZ=Europe/Berlin date -d "$letzter" '+%d.%m. %H:%M')" -b "Der Wächter stößt neu an. Lauf: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" || true; fi
          fi
          # S3.2: veröffentlichter Datenstand älter als 45 Min. (Läufe grün, aber nichts kommt an) → Issue „ausfall“
          st_at=$(curl -fsS -m 20 "https://raw.githubusercontent.com/$REPO/data/status.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).at||"")}catch{console.log("")}})' || true)
          if [ -n "$st_at" ] && [ $(( $(date +%s) - st_at / 1000 )) -gt 2700 ]; then
            offen=$(gh issue list -R "$REPO" -l ausfall -s open --json number -q '.[0].number' 2>/dev/null || true)
            if [ -z "$offen" ]; then gh label create ausfall -R "$REPO" -c B60205 -d "Sammler-Teilausfall (automatisch)" 2>/dev/null || true
              gh issue create -R "$REPO" -l ausfall -t "Datenstand veraltet: status.json von $(TZ=Europe/Berlin date -d "@$(( st_at / 1000 ))" '+%d.%m. %H:%M')" -b "status.json ist älter als 45 Minuten (Veröffentlichung im Branch data prüfen). Lauf: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" || true; fi
          fi
          neuer() { gh run list -R "$REPO" -w waechter.yml -L 10 --json databaseId,status -q "[.[] | select(.databaseId > $GITHUB_RUN_ID and .status != \"completed\")] | length" || echo 0; }
          if [ "$(neuer)" -gt 0 ]; then echo "Neuerer Wächter-Lauf wartet – keine zweite Kette"; exit 0; fi
          n=$(sammler); echo "Aktive Sammler-Läufe: $n"
          if [ "$n" -eq 0 ]; then
            sleep 60; n=$(sammler)
            if [ "$n" -eq 0 ]; then
              echo "Kein Sammler-Lauf aktiv – Kette abgerissen, stoße neu an"
              anstossen collect.yml && echo "Sammler angestoßen"
            fi
          else echo "Kette intakt"; fi
          sleep 840
          if [ "$(neuer)" -gt 0 ]; then echo "Inzwischen wartet ein neuerer Wächter-Lauf – Ende"; exit 0; fi
          if anstossen waechter.yml; then echo "Nächste Prüfung angestoßen"; exit 0; fi
          exit 1
