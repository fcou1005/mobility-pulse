name: Sammler

on:
  schedule:
    - cron: '8,28,49 * * * *'   # nicht zur vollen Stunde (Lastspitze bei GitHub)
  workflow_dispatch:
    inputs:
      rebuild_boundaries:
        description: 'Gemeindegrenzen neu aufbereiten'
        type: boolean
        default: false
      takt:
        description: 'Takt der Kette in Minuten (Standard 20; 5 für eine Stichprobe)'
        type: string
        default: '20'
      takt_bis:
        description: 'Takt gilt bis einschließlich (JJJJ-MM-TT), danach wieder 20 Min.'
        type: string
        default: ''

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-24.04   # fest, damit der Wechsel auf Ubuntu 26 nichts kaputt macht
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # Token nicht im Checkout ablegen; Push nutzt eigenen Token

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bisherigen Datenstand (Branch data) holen
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git archive refs/remotes/origin/data | tar -x -C out
            echo "Datenstand übernommen: $(ls out | tr '\n' ' ')"
          else
            echo "Noch kein Datenstand"
          fi

      - name: Monat für Grenzen-Cache
        id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Gemeindegrenzen aus Cache
        id: bcache
        if: ${{ !inputs.rebuild_boundaries }}
        uses: actions/cache@v5
        with:
          path: cache/boundaries.json
          key: vg250-${{ steps.month.outputs.m }}-v2
          restore-keys: |
            vg250-

      - name: Gemeindegrenzen aufbereiten (BKG VG250)
        if: ${{ steps.bcache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin unzip >/dev/null
          mkdir -p cache
          # Neuer Monat: frische Grenzen laden; ist BKG nicht erreichbar, bleiben die Grenzen aus dem Vormonat
          if BOUNDARIES_OUT=cache/boundaries.new.json node scripts/prepare-boundaries.mjs; then mv cache/boundaries.new.json cache/boundaries.json
          elif [ -s cache/boundaries.json ]; then echo "BKG nicht erreichbar, nutze Grenzen aus dem Cache"
          else exit 2; fi

      - name: Quellenkatalog aktualisieren
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: node scripts/build-catalog.mjs

      - name: Verfolgungszustand aus dem privaten Cache
        uses: actions/cache/restore@v5
        with:
          path: track-state
          key: track-${{ github.run_id }}
          restore-keys: |
            track-

      - name: Sammeln
        env:
          TRACK_DIR: track-state
          DATA_DIR: out
          BOUNDARIES: cache/boundaries.json
          SOURCES_FILE: data/sources.json
          HISTORY_DAYS: '30'
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: |
          cp data/sources.json out/sources.json
          node scripts/collect.mjs
          ls -la out out/history | head -40

      - name: Veröffentlichen (Branch data, ein Commit)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}"
          # alten Stand holen: der Push überträgt dann nur geänderte Dateien (der Commit bleibt ohne Vorgänger)
          git fetch -q --depth 1 origin data || echo "kein alter Datenstand"
          git checkout -q --orphan data
          git add -A
          git -c user.name='mobility-pulse-bot' -c user.email='bot@users.noreply.github.com' commit -qm "Daten $(date -u +%FT%TZ)"
          git push -f -q origin data:data
          echo "veröffentlicht: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/latest.json"
      - name: Verfolgungszustand im privaten Cache sichern
        if: ${{ always() && hashFiles('track-state/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: track-state
          key: track-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Nächsten Lauf anstoßen (hält genau eine Kette am Leben, egal ob der Zeitplan anspringt)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAKT_IN: ${{ inputs.takt }}
          BIS_IN: ${{ inputs.takt_bis }}
        run: |
          andere() { gh run list -R "$GITHUB_REPOSITORY" -w collect.yml -L 10 --json databaseId,status -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length" || echo 0; }
          if [ "$(andere)" -gt 0 ]; then echo "Ein anderer Lauf ist aktiv oder wartet, keine zweite Kette"; exit 0; fi
          TAKT="$TAKT_IN"; BIS="$BIS_IN"
          case "$TAKT" in ''|*[!0-9]*) TAKT=20 ;; esac
          if ! [[ "$BIS" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then BIS=''; fi
          if [ -n "$BIS" ] && [[ "$(TZ=Europe/Berlin date +%F)" > "$BIS" ]]; then TAKT=20; BIS=''; fi
          if [ -z "$BIS" ]; then TAKT=20; fi
          if [ "$TAKT" -lt 5 ]; then TAKT=5; fi
          WARTEN=$(( TAKT * 60 - 300 )); if [ "$WARTEN" -lt 30 ]; then WARTEN=30; fi
          echo "Takt ${TAKT} Min. (bis ${BIS:-unbegrenzt}), warte ${WARTEN} s"
          sleep "$WARTEN"
          if [ "$(andere)" -gt 0 ]; then echo "Inzwischen läuft ein anderer Lauf, keine zweite Kette"; exit 0; fi
          if [ "$TAKT" != 20 ]; then gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main -f takt="$TAKT" -f takt_bis="$BIS"
          else gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main; fi
